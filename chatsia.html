<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siraisia's safe zone</title>
<link rel="stylesheet" href="style3.css">
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'ar',
    autoDisplay: false
  }, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>

<body>

<div id="google_translate_element"></div>

<header class="navbar">
    <a href="index.html" class="nav-btn" id="homeBtn">العودة للرئيسية</a>

    <div class="nav-controls">
        <div class="lang-dropdown-container notranslate">
            <button class="nav-btn" onclick="toggleLangDropdown()">Language\اللغة <span id="langLabel">اللغة</span></button>
            <div class="lang-menu notranslate" id="langDropdown"></div>
        </div>

        <button class="nav-btn" onclick="toggleTheme()">theme\ المظهر</button>
    </div>
</header>

<main class="content-wrapper">
    <section class="inspiration-card">
        <div class="card-badge" id="cardCategory">ألكسير الوعي</div>
        <div class="card-quote" id="quoteText">نصيحة ألكسير الوعي</div>
        <button class="action-btn" id="genBtn" onclick="generateQuote()">الحصول على أمل جديد</button>
    </section>

    <section class="chat-container">
        <div class="chat-header">
            <div class="user-meta">
                <div class="avatar-wrapper">
                    <div class="avatar-icon">Sia</div>
                    <span class="status-online"></span>
                </div>
                <h3 id="chatTitle">جلسة المحادثة المباشرة مع <span class="notranslate">Siraisia</span></h3>
            </div>

            <div class="chat-toolbar">
                <button class="btn-secondary" onclick="openProfileModal()">الملف الشخصي</button>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="chatSearch" placeholder="بحث..." oninput="searchMessages()">
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message-item received">
                <div class="msg-avatar-icon">Sia</div>
                <div class="message-bubble">
                    <span class="msg-content">أهلا بك في ملاذك الآمن، قم بإرسال ما تشاء ، سنكون بإنتظارك</span>
                    <div class="msg-meta">
                        <span class="time">13:57</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="اكتب رسالتك بالتفصيل هنا..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال الرسالة</button>
        </div>
    </section>
</main>

<div class="modal-overlay" id="profileModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>تعديل البيانات الشخصية</h3>
            <button class="close-btn" onclick="closeProfileModal()">✕</button>
        </div>

        <div class="avatar-preview-box">
            <div class="preview-avatar" id="previewAvatar">A star of our Elixir</div>
            <span class="preview-label">الصورة الحالية</span>
        </div>

        <div class="field-group">
            <label>اسم المستخدم:</label>
            <input type="text" id="userNameInput" placeholder="أدخل اسمك هنا..." value="المستخدم">
        </div>

        <div class="field-group">
            <label>تغيير الصورة الشخصية:</label>
            <input type="file" id="userAvatarInput" accept="image/*" onchange="handleImageUpload(event)">
        </div>

        <button class="save-btn" onclick="saveProfileSettings()">حفظ</button>
    </div>
</div>

<script>
let isFirstMessageSent = false;
let currentSiteLangCode = 'ar';

let currentUser = {
    name: "المستخدم",
    avatarBg: "#d97706",
    avatarText: "U",
    avatarImage: null
};

const languagesList = [
    { code: 'ar', name: 'العربية' },
    { code: 'en', name: 'English' },
    { code: 'fr', name: 'Français' },
    { code: 'es', name: 'Español' },
    { code: 'de', name: 'Deutsch' },
    { code: 'it', name: 'Italiano' },
    { code: 'ru', name: 'Русский' },
    { code: 'zh-CN', name: '简体中文' },
    { code: 'ja', name: '日本語' },
    { code: 'ko', name: '한국어' },
    { code: 'pt', name: 'Português' },
    { code: 'tr', name: 'Türkçe' },
    { code: 'nl', name: 'Nederlands' },
    { code: 'pl', name: 'Polski' },
    { code: 'sv', name: 'Svenska' },
    { code: 'no', name: 'Norsk' },
    { code: 'da', name: 'Dansk' },
    { code: 'fi', name: 'Suomi' },
    { code: 'el', name: 'Ελληνικά' },
    { code: 'he', name: 'عברית' },
    { code: 'fa', name: 'فارسی' },
    { code: 'ur', name: 'اردو' },
    { code: 'hi', name: 'हिन्दी' },
    { code: 'bn', name: 'বাংলা' },
    { code: 'id', name: 'Bahasa Indonesia' },
    { code: 'ms', name: 'Bahasa Melayu' },
    { code: 'th', name: 'ไทย' },
    { code: 'vi', name: 'Tiếng Việt' },
    { code: 'uk', name: 'Українська' },
    { code: 'cs', name: 'Čeština' },
    { code: 'hu', name: 'Magyar' },
    { code: 'ro', name: 'Română' },
    { code: 'sk', name: 'Slovenčina' },
    { code: 'bg', name: 'Български' },
    { code: 'hr', name: 'Hrvatski' },
    { code: 'sr', name: 'Српски' },
    { code: 'sl', name: 'Slovenščina' },
    { code: 'et', name: 'Eesti' },
    { code: 'lv', name: 'Latviešu' },
    { code: 'lt', name: 'Lietuvių' },
    { code: 'tl', name: 'Tagalog' },
    { code: 'sw', name: 'Kiswahili' },
    { code: 'af', name: 'Afrikaans' },
    { code: 'sq', name: 'Shqip' },
    { code: 'hy', name: 'Հայերեն' },
    { code: 'az', name: 'Azərbaycan' },
    { code: 'eu', name: 'Euskara' },
    { code: 'be', name: 'Беларуская' },
    { code: 'bs', name: 'Bosanski' },
    { code: 'ca', name: 'Català' },
    { code: 'ka', name: 'ქართული' },
    { code: 'is', name: 'Íslenska' },
    { code: 'mk', name: 'Македонски' },
    { code: 'mt', name: 'Malti' },
    { code: 'ga', name: 'Gaeilge' },
    { code: 'cy', name: 'Cymraeg' },
    { code: 'gl', name: 'Galego' }
];

function buildLangDropdown() {
    const dropdown = document.getElementById('langDropdown');
    dropdown.innerHTML = '';
    languagesList.forEach(lang => {
        const a = document.createElement('a');
        a.href = "javascript:void(0)";
        a.className = "notranslate";
        a.innerText = lang.name;
        a.onclick = () => setWholePageLanguage(lang.code, lang.name);
        dropdown.appendChild(a);
    });
}

function setWholePageLanguage(langCode, langName) {
    document.getElementById("langDropdown").classList.remove("show");
    document.getElementById("langLabel").innerText = langName;
    currentSiteLangCode = langCode;

    const googleSelect = document.querySelector('.goog-te-combo');
    if (googleSelect) {
        googleSelect.value = langCode;
        googleSelect.dispatchEvent(new Event('change'));
    }
}

const quotesData = [
    { category: "التوازن النفسي", text: "إدراكك لمشاعرك وقبولك لها في الوقت الحالي هو الخطوة الأولى والأساسية نحو استعادة توازنك الداخلي." },
    { category: "الاستمرارية", text: "التقدم لا يتطلب خطوات عملاقة دائماً؛ الاستمرار في المحاولة والتكيف اليومي هو الإنجاز الحقيقي." },
    { category: "الوعي الذاتي", text: "من الحق الكامل لذهنك وبدنك الحصول على أوقات من الراحة التامة لإعادة تنظيم الأفكار وتجديد الطاقة." },
    { category: "المرونة النفسية", text: "التحديات الحالية هي مراحل انتقالية لترسيخ خبراتك؛ خذ وقتك الكافي في التعامل مع القلق." },
    { category: "التقدير الذاتي", text: "ما تجتازه يومياً برزانة وصبر يعكس مستويات عالية من القدرة والثبات؛ كن منصفاً مع ذاتك." },
    { category: "حورس", text: "حورس في الآفاق لكن ينتظر من يجروء على النظر إليه" }
];

function generateQuote() {
    const randomIndex = Math.floor(Math.random() * quotesData.length);
    const item = quotesData[randomIndex];
    document.getElementById("quoteText").innerText = item.text;
    document.getElementById("cardCategory").innerText = item.category;
}

function toggleLangDropdown() {
    document.getElementById("langDropdown").classList.toggle("show");
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme", currentTheme === "light" ? "dark" : "light");
}

function openProfileModal() {
    document.getElementById("userNameInput").value = currentUser.name;
    updatePreviewAvatar();
    document.getElementById("profileModal").classList.add("show");
}

function closeProfileModal() {
    document.getElementById("profileModal").classList.remove("show");
}

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            currentUser.avatarImage = e.target.result;
            updatePreviewAvatar();
        };
        reader.readAsDataURL(file);
    }
}

function updatePreviewAvatar() {
    const preview = document.getElementById("previewAvatar");
    if (currentUser.avatarImage) {
        preview.style.backgroundImage = `url(${currentUser.avatarImage})`;
        preview.innerText = "";
    } else {
        preview.style.backgroundImage = "none";
        preview.innerText = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : "U";
    }
}

function saveProfileSettings() {
    const newName = document.getElementById("userNameInput").value.trim();
    if (newName) {
        currentUser.name = newName;
        currentUser.avatarText = newName.charAt(0).toUpperCase();
    }
    
    const userAvatars = document.querySelectorAll('.message-item.sent .msg-avatar-icon');
    userAvatars.forEach(avatar => {
        applyAvatarStyles(avatar);
    });

    closeProfileModal();
}

function applyAvatarStyles(element) {
    if (currentUser.avatarImage) {
        element.style.backgroundImage = `url(${currentUser.avatarImage})`;
        element.innerText = "";
    } else {
        element.style.backgroundImage = "none";
        element.innerText = currentUser.avatarText;
    }
}

function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    
    if (text !== '') {
        const messagesContainer = document.getElementById('chatMessages');
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const wrapper = document.createElement('div');
        wrapper.className = 'message-item sent';

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'msg-avatar-icon user-msg-avatar';
        applyAvatarStyles(avatarDiv);

        const msgDiv = document.createElement('div');
        msgDiv.className = 'message-bubble';
        msgDiv.innerHTML = `
            <span class="msg-content">${text}</span>
            <div class="msg-meta">
                <span class="time">${timeString}</span>
            </div>
        `;

        wrapper.appendChild(avatarDiv);
        wrapper.appendChild(msgDiv);
        messagesContainer.appendChild(wrapper);

        input.value = '';
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        if (!isFirstMessageSent) {
            isFirstMessageSent = true;
            setTimeout(() => {
                const autoWrapper = document.createElement('div');
                autoWrapper.className = 'message-item received';
                const autoText = "مبسوطة بوجودك هنا، يا ريت تحكي كل اللي ف قلبك ، وهرد بأسرع وقت ممكن إن شاء الله";                
                autoWrapper.innerHTML = `
                    <div class="msg-avatar-icon">M</div>
                    <div class="message-bubble">
                        <span class="msg-content">${autoText}</span>
                        <div class="msg-meta">
                            <span class="time">${timeString}</span>
                        </div>
                    </div>
                `;
                messagesContainer.appendChild(autoWrapper);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1200);
        }
    }
}

function searchMessages() {
    const query = document.getElementById('chatSearch').value.toLowerCase().trim();
    const wrappers = document.querySelectorAll('.message-item');

    wrappers.forEach(wrapper => {
        const text = wrapper.querySelector('.message-bubble').innerText.toLowerCase();
        if (text.includes(query)) {
            wrapper.classList.remove('hidden');
        } else {
            wrapper.classList.add('hidden');
        }
    });
}

function handleKeyPress(event) {
    if (event.key === 'Enter') {
        sendMessage();
    }
}

window.onclick = function(event) {
    if (!event.target.matches('.nav-btn')) {
        const dropdown = document.getElementById("langDropdown");
        if (dropdown && dropdown.classList.contains('show')) {
            dropdown.classList.remove('show');
        }
    }
}

buildLangDropdown();
generateQuote();
</script>

</body>
</html>
