<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siraisia's safe zone</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

:root {
    --bg-gradient: linear-gradient(135deg, #0b0712, #180d28);
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(168, 85, 247, 0.25);
    --text-main: #f3e8ff;
    --text-sub: #a855f7;
    --accent-purple: #9333ea;
    --accent-purple-hover: #7e22ce;
    --msg-user-bg: linear-gradient(135deg, #a855f7, #9333ea);
    --msg-other-bg: rgba(255, 255, 255, 0.06);
    --btn-bg: rgba(255, 255, 255, 0.08);
    --dropdown-bg: #180d28;
    --scroll-thumb: #9333ea;
    --scroll-track: rgba(255, 255, 255, 0.03);
}

[data-theme="light"] {
    --bg-gradient: linear-gradient(135deg, #f3e8ff, #faf5ff);
    --card-bg: rgba(255, 255, 255, 0.9);
    --card-border: rgba(147, 51, 234, 0.3);
    --text-main: #2e1065;
    --text-sub: #6b21a8;
    --accent-purple: #7e22ce;
    --accent-purple-hover: #6b21a8;
    --msg-user-bg: #9333ea;
    --msg-other-bg: rgba(0, 0, 0, 0.04);
    --btn-bg: #ffffff;
    --dropdown-bg: #ffffff;
    --scroll-thumb: #a855f7;
    --scroll-track: rgba(0, 0, 0, 0.05);
}

.goog-te-banner-frame, 
.skiptranslate, 
#goog-gt-tt, 
.goog-te-balloon-frame { 
    display: none !important; 
}
body { 
    top: 0px !important; 
}
#google_translate_element { 
    display: none; 
}

::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: var(--scroll-track);
    border-radius: 10px;
}
::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
    background: var(--accent-purple-hover);
}

body {
    background: var(--bg-gradient);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.navbar {
    display: flex;
    width: 100%;
    max-width: 900px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    z-index: 100;
}

.nav-controls {
    display: flex;
    gap: 10px;
}

.nav-btn {
    background: var(--btn-bg);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.88rem;
    letter-spacing: 0.3px;
    text-decoration: none;
}

.nav-btn:hover {
    border-color: var(--accent-purple);
}

.lang-dropdown-container {
    position: relative;
}

.lang-menu {
    display: none;
    position: absolute;
    top: 45px;
    right: 0;
    background: var(--dropdown-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    width: 200px;
    max-height: 300px;
    overflow-y: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    z-index: 110;
}

.lang-menu.show { display: block; }

.lang-menu a {
    display: block;
    padding: 10px 14px;
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.85rem;
    text-align: right;
    border-bottom: 1px solid rgba(255,255,255,0.02);
}

.lang-menu a:hover {
    background: var(--accent-purple);
    color: #ffffff;
}

.content-wrapper {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.inspiration-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-top: 3px solid var(--accent-purple);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
}

.card-badge {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-sub);
    margin-bottom: 12px;
    font-weight: 700;
}

.card-quote {
    font-size: 1.1rem;
    line-height: 1.7;
    font-weight: 500;
    margin-bottom: 20px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.action-btn {
    background: var(--accent-purple);
    color: #ffffff;
    border: none;
    padding: 10px 28px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
}

.action-btn:hover {
    background: var(--accent-purple-hover);
}

.chat-container {
    height: 560px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-top: 3px solid var(--accent-purple);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-header {
    padding: 14px 20px;
    background: rgba(11, 7, 18, 0.4);
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.user-meta {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar-wrapper {
    position: relative;
    width: 42px;
    height: 42px;
}

.avatar-icon, .msg-avatar-icon {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--accent-purple);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.1rem;
    border: 2px solid var(--card-border);
    background-size: cover;
    background-position: center;
    overflow: hidden;
}

.msg-avatar-icon {
    width: 34px;
    height: 34px;
    font-size: 0.9rem;
    flex-shrink: 0;
}

.user-msg-avatar {
    background-color: #d97706;
}

.status-online {
    width: 10px;
    height: 10px;
    background-color: #a855f7;
    border-radius: 50%;
    position: absolute;
    bottom: 0;
    right: 0;
    border: 2px solid #0b0712;
    box-shadow: 0 0 8px #a855f7;
}

.chat-header h3 {
    font-size: 0.98rem;
    font-weight: 600;
    color: var(--text-main);
}

.chat-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 600;
}

.btn-secondary:hover {
    background: var(--accent-purple);
    color: #fff;
}

.search-box {
    position: relative;
    width: 180px;
}

.search-input {
    width: 100%;
    padding: 8px 12px;
    padding-right: 30px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    font-size: 0.82rem;
    outline: none;
}

.search-input:focus {
    border-color: var(--accent-purple);
}

.search-icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.8rem;
    opacity: 0.6;
}

.chat-messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.message-item {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    max-width: 82%;
}

.message-item.sent {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.message-item.received {
    align-self: flex-start;
    flex-direction: row;
}

.message-bubble {
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 0.92rem;
    line-height: 1.5;
    position: relative;
    word-wrap: break-word;
    width: 100%;
}

.message-item.sent .message-bubble {
    background: var(--msg-user-bg);
    color: #ffffff;
    font-weight: 500;
    border-bottom-left-radius: 2px;
}

.message-item.received .message-bubble {
    background: var(--msg-other-bg);
    color: var(--text-main);
    border: 1px solid var(--card-border);
    border-bottom-right-radius: 2px;
}

.msg-meta {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-top: 6px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 4px;
}

.message-bubble .time {
    font-size: 0.68rem;
    opacity: 0.65;
}

.chat-input-area {
    padding: 15px;
    border-top: 1px solid var(--card-border);
    display: flex;
    gap: 12px;
}

.chat-input-area input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-main);
    outline: none;
    font-size: 0.9rem;
}

.chat-input-area input:focus {
    border-color: var(--accent-purple);
}

.send-btn {
    background: var(--accent-purple);
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
}

.send-btn:hover { background: var(--accent-purple-hover); }

.message-item.hidden {
    display: none !important;
}

.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    z-index: 200;
    justify-content: center;
    align-items: center;
}

.modal-overlay.show {
    display: flex;
}

.modal-card {
    background: var(--dropdown-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    width: 90%;
    max-width: 420px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.5);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 12px;
}

.modal-header h3 {
    font-size: 1.1rem;
    color: var(--text-main);
}

.close-btn {
    background: none;
    border: none;
    color: var(--text-main);
    font-size: 1.2rem;
    cursor: pointer;
}

.avatar-preview-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.preview-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #d97706;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: bold;
    border: 2px solid var(--card-border);
    background-size: cover;
    background-position: center;
}

.field-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.field-group label {
    font-size: 0.85rem;
    color: var(--text-sub);
    font-weight: 600;
}

.field-group input[type="text"] {
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    outline: none;
}

.field-group input[type="file"] {
    font-size: 0.8rem;
    color: var(--text-main);
}

.save-btn {
    background: var(--accent-purple);
    color: #ffffff;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
}

.save-btn:hover {
    background: var(--accent-purple-hover);
}
</style>

<body>

<div id="google_translate_element"></div>

<header class="navbar">
    <a href="index.html" class="nav-btn" id="homeBtn">العودة للرئيسية</a>

    <div class="nav-controls">
        <div class="lang-dropdown-container notranslate">
            <button class="nav-btn" onclick="toggleLangDropdown()">Language\اللغة <span id="langLabel">اللغة</span></button>
            <div class="lang-menu notranslate" id="langDropdown"></div>
        </div>

        <button class="nav-btn" onclick="toggleTheme()">theme\ المظهر</button>
    </div>
</header>

<main class="content-wrapper">
    <section class="inspiration-card">
        <div class="card-badge" id="cardCategory">ألكسير الوعي</div>
        <div class="card-quote" id="quoteText">نصيحة ألكسير الوعي</div>
        <button class="action-btn" id="genBtn" onclick="generateQuote()">الحصول على أمل جديد</button>
    </section>

    <section class="chat-container">
        <div class="chat-header">
            <div class="user-meta">
                <div class="avatar-wrapper">
                    <div class="avatar-icon">Sia</div>
                    <span class="status-online"></span>
                </div>
                <h3 id="chatTitle">جلسة المحادثة المباشرة مع <span class="notranslate">Siraisia</span></h3>
            </div>

            <div class="chat-toolbar">
                <button class="btn-secondary" onclick="openProfileModal()">الملف الشخصي</button>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="chatSearch" placeholder="بحث..." oninput="searchMessages()">
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message-item received">
                <div class="msg-avatar-icon">Sia</div>
                <div class="message-bubble">
                    <span class="msg-content">أهلا بك في ملاذك الآمن، قم بإرسال ما تشاء ، سنكون بإنتظارك</span>
                    <div class="msg-meta">
                        <span class="time">13:57</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="اكتب رسالتك بالتفصيل هنا..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال الرسالة</button>
        </div>
    </section>
</main>

<div class="modal-overlay" id="profileModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>تعديل البيانات الشخصية</h3>
            <button class="close-btn" onclick="closeProfileModal()">✕</button>
        </div>

        <div class="avatar-preview-box">
            <div class="preview-avatar" id="previewAvatar">A star of our Elixir</div>
            <span class="preview-label">الصورة الحالية</span>
        </div>

        <div class="field-group">
            <label>اسم المستخدم:</label>
            <input type="text" id="userNameInput" placeholder="أدخل اسمك هنا..." value="المستخدم">
        </div>

        <div class="field-group">
            <label>تغيير الصورة الشخصية:</label>
            <input type="file" id="userAvatarInput" accept="image/*" onchange="handleImageUpload(event)">
        </div>

        <button class="save-btn" onclick="saveProfileSettings()">حفظ</button>
    </div>
</div>

<script>
let isFirstMessageSent = false;
let currentSiteLangCode = 'ar';

let currentUser = {
    name: "المستخدم",
    avatarBg: "#d97706",
    avatarText: "U",
    avatarImage: null
};

const languagesList = [
    { code: 'ar', name: 'العربية' },
    { code: 'en', name: 'English' },
    { code: 'fr', name: 'Français' },

    { code: 'pl', name: 'Polski' },
    { code: 'sv', name: 'Svenska' },

    { code: 'ur', name: 'اردو' },
    { code: 'hi', name: 'हिन्दी' },
    { code: 'bn', name: 'বাংলা' },
    { code: 'id', name: 'Bahasa Indonesia' },
    { code: 'ms', name: 'Bahasa Melayu' },
    { code: 'th', name: 'ไทย' },
    { code: 'vi', name: 'Tiếng Việt' },
    { code: 'uk', name: 'Українська' },
    { code: 'cs', name: 'Čeština' },
    { code: 'hu', name: 'Magyar' },
    { code: 'ro', name: 'Română' },
    { code: 'sk', name: 'Slovenčina' },
    { code: 'bg', name: 'Български' },
    { code: 'hr', name: 'Hrvatski' },
    { code: 'sr', name: 'Српски' },
    { code: 'sl', name: 'Slovenščina' },
    { code: 'et', name: 'Eesti' },

    { code: 'tl', name: 'Tagalog' },

    { code: 'ga', name: 'Gaeilge' },

    { code: 'gl', name: 'Galego' }
];

function buildLangDropdown() {
    const dropdown = document.getElementById('langDropdown');
    dropdown.innerHTML = '';
    languagesList.forEach(lang => {
        const a = document.createElement('a');
        a.href = "javascript:void(0)";
        a.className = "notranslate";
        a.innerText = lang.name;
        a.onclick = () => setWholePageLanguage(lang.code, lang.name);
        dropdown.appendChild(a);
    });
}

function setWholePageLanguage(langCode, langName) {
    document.getElementById("langDropdown").classList.remove("show");
    document.getElementById("langLabel").innerText = langName;
    currentSiteLangCode = langCode;

    const googleSelect = document.querySelector('.goog-te-combo');
    if (googleSelect) {
        googleSelect.value = langCode;
        googleSelect.dispatchEvent(new Event('change'));
    }
}

const quotesData = [
    { category: "التوازن النفسي", text: "إدراكك لمشاعرك وقبولك لها في الوقت الحالي هو الخطوة الأولى والأساسية نحو استعادة توازنك الداخلي." },
    { category: "الاستمرارية", text: "التقدم لا يتطلب خطوات عملاقة دائماً؛ الاستمرار في المحاولة والتكيف اليومي هو الإنجاز الحقيقي." },
    { category: "الوعي الذاتي", text: "من الحق الكامل لذهنك وبدنك الحصول على أوقات من الراحة التامة لإعادة تنظيم الأفكار وتجديد الطاقة." },
    { category: "المرونة النفسية", text: "التحديات الحالية هي مراحل انتقالية لترسيخ خبراتك؛ خذ وقتك الكافي في التعامل مع القلق." },
    { category: "التقدير الذاتي", text: "ما تجتازه يومياً برزانة وصبر يعكس مستويات عالية من القدرة والثبات؛ كن منصفاً مع ذاتك." },
    { category: "حورس", text: "حورس في الآفاق لكن ينتظر من يجروء على النظر إليه" }
];

function generateQuote() {
    const randomIndex = Math.floor(Math.random() * quotesData.length);
    const item = quotesData[randomIndex];
    document.getElementById("quoteText").innerText = item.text;
    document.getElementById("cardCategory").innerText = item.category;
}

function toggleLangDropdown() {
    document.getElementById("langDropdown").classList.toggle("show");
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme", currentTheme === "light" ? "dark" : "light");
}

function openProfileModal() {
    document.getElementById("userNameInput").value = currentUser.name;
    updatePreviewAvatar();
    document.getElementById("profileModal").classList.add("show");
}

function closeProfileModal() {
    document.getElementById("profileModal").classList.remove("show");
}

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            currentUser.avatarImage = e.target.result;
            updatePreviewAvatar();
        };
        reader.readAsDataURL(file);
    }
}

function updatePreviewAvatar() {
    const preview = document.getElementById("previewAvatar");
    if (currentUser.avatarImage) {
        preview.style.backgroundImage = `url(${currentUser.avatarImage})`;
        preview.innerText = "";
    } else {
        preview.style.backgroundImage = "none";
        preview.innerText = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : "U";
    }
}

function saveProfileSettings() {
    const newName = document.getElementById("userNameInput").value.trim();
    if (newName) {
        currentUser.name = newName;
        currentUser.avatarText = newName.charAt(0).toUpperCase();
    }
    
    const userAvatars = document.querySelectorAll('.message-item.sent .msg-avatar-icon');
    userAvatars.forEach(avatar => {
        applyAvatarStyles(avatar);
    });

    closeProfileModal();
}

function applyAvatarStyles(element) {
    if (currentUser.avatarImage) {
        element.style.backgroundImage = `url(${currentUser.avatarImage})`;
        element.innerText = "";
    } else {
        element.style.backgroundImage = "none";
        element.innerText = currentUser.avatarText;
    }
}

function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    
    if (text !== '') {
        const messagesContainer = document.getElementById('chatMessages');
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const wrapper = document.createElement('div');
        wrapper.className = 'message-item sent';

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'msg-avatar-icon user-msg-avatar';
        applyAvatarStyles(avatarDiv);

        const msgDiv = document.createElement('div');
        msgDiv.className = 'message-bubble';
        msgDiv.innerHTML = `
            <span class="msg-content">${text}</span>
            <div class="msg-meta">
                <span class="time">${timeString}</span>
            </div>
        `;

        wrapper.appendChild(avatarDiv);
        wrapper.appendChild(msgDiv);
        messagesContainer.appendChild(wrapper);

        input.value = '';
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        if (!isFirstMessageSent) {
            isFirstMessageSent = true;
            setTimeout(() => {
                const autoWrapper = document.createElement('div');
                autoWrapper.className = 'message-item received';
                const autoText = "مبسوطة بوجودك هنا، يا ريت تحكي كل اللي ف قلبك ، وهرد بأسرع وقت ممكن إن شاء الله";                
                autoWrapper.innerHTML = `
                    <div class="msg-avatar-icon">M</div>
                    <div class="message-bubble">
                        <span class="msg-content">${autoText}</span>
                        <div class="msg-meta">
                            <span class="time">${timeString}</span>
                        </div>
                    </div>
                `;
                messagesContainer.appendChild(autoWrapper);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1200);
        }
    }
}

function searchMessages() {
    const query = document.getElementById('chatSearch').value.toLowerCase().trim();
    const wrappers = document.querySelectorAll('.message-item');

    wrappers.forEach(wrapper => {
        const text = wrapper.querySelector('.message-bubble').innerText.toLowerCase();
        if (text.includes(query)) {
            wrapper.classList.remove('hidden');
        } else {
            wrapper.classList.add('hidden');
        }
    });
}

function handleKeyPress(event) {
    if (event.key === 'Enter') {
        sendMessage();
    }
}

window.onclick = function(event) {
    if (!event.target.matches('.nav-btn')) {
        const dropdown = document.getElementById("langDropdown");
        if (dropdown && dropdown.classList.contains('show')) {
            dropdown.classList.remove('show');
        }
    }
}

buildLangDropdown();
generateQuote();
</script>
